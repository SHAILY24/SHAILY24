<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" role="img"
     aria-label="Shaily Sharma, Python data engineer. Anti-bot scraping into clean, matched, automated data.">
  <title>Shaily Sharma. Python data engineer.</title>
  <desc>Name and role over a dark terminal panel with a slow aurora and a steady cursor. Motion is gentle by design.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e16"/>
      <stop offset="1" stop-color="#11161f"/>
    </linearGradient>
    <linearGradient id="au1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58cdbe" stop-opacity="0"/>
      <stop offset=".42" stop-color="#58cdbe" stop-opacity=".7"/>
      <stop offset=".68" stop-color="#74d6af" stop-opacity=".55"/>
      <stop offset="1" stop-color="#6aaef0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="au2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6aaef0" stop-opacity="0"/>
      <stop offset=".5" stop-color="#74d6af" stop-opacity=".45"/>
      <stop offset=".8" stop-color="#e3a3c4" stop-opacity=".34"/>
      <stop offset="1" stop-color="#e3a3c4" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-60%" width="160%" height="240%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <style>
      .name{font:700 60px ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
            fill:#f3f0e9;letter-spacing:5px}
      .role{font:400 24px ui-monospace,Menlo,Consolas,monospace;fill:#cdd6e4}
      .flow{font:400 17px ui-monospace,Menlo,Consolas,monospace;fill:#74d6af;letter-spacing:1px}
      .tag {font:400 14px ui-monospace,Menlo,Consolas,monospace;fill:#8893a5;letter-spacing:2px}
      .dim {fill:#3a4456}
      .cur {fill:#58cdbe;animation:bl 1.15s steps(1) infinite}
      .a1{animation:d1 17s ease-in-out infinite alternate}
      .a2{animation:d2 23s ease-in-out infinite alternate}
      @keyframes d1{from{transform:translateX(-30px)}to{transform:translateX(34px)}}
      @keyframes d2{from{transform:translateX(28px)}to{transform:translateX(-32px)}}
      @keyframes bl{50%{opacity:0}}
    </style>
  </defs>

  <rect width="1280" height="300" fill="url(#sky)"/>
  <g fill="#cdd6e4" opacity=".42">
    <circle cx="140" cy="44" r="1"/><circle cx="320" cy="28" r="1.2"/>
    <circle cx="560" cy="52" r="1"/><circle cx="820" cy="34" r="1.1"/>
    <circle cx="1000" cy="58" r="1"/><circle cx="1160" cy="40" r="1.2"/>
  </g>
  <g filter="url(#soft)">
    <path class="a1" d="M-80,140 C 260,66 520,196 820,112 C 1020,58 1180,140 1360,104
                         L1360,196 C 1180,234 1020,160 820,206
                         C 520,282 260,168 -80,234 Z" fill="url(#au1)"/>
    <path class="a2" d="M-80,192 C 300,142 600,248 900,174 C 1080,132 1240,196 1360,164
                         L1360,234 C 1240,266 1080,220 900,248
                         C 600,308 300,238 -80,266 Z" fill="url(#au2)"/>
  </g>
  <rect x="0" y="282" width="1280" height="1" fill="#27303f"/>

  <text class="tag" x="84" y="62"><tspan class="dim">~/shaily</tspan>  on  main</text>
  <text class="name" x="82" y="142">SHAILY SHARMA</text>
  <text class="role" x="86" y="180">Python data engineer<tspan class="cur"> &#x2588;</tspan></text>
  <text class="flow" x="86" y="216">scrape past the block  ::  clean  ::  fuzzy-match  ::  automate  ::  ship</text>
  <text class="tag"  x="86" y="252">TOP RATED ON UPWORK   /   JERSEY CITY, NJ   /   PYTHON  FASTAPI  REACT  ETL</text>
</svg>
